function show(type, text){feedback.className=&#x27;notice &#x27;+type;feedback.textContent=text;}
function explainError(err){
  if(err &amp;&amp; err.name===&#x27;TypeError&#x27; &amp;&amp; /fetch/i.test(err.message||&#x27;&#x27;)) return &#x27;خطای اتصال به سرور (Failed to fetch).\nعلت‌های احتمالی: اینترنت یا فیلتر بودن Supabase، آدرس اشتباه پروژه، محدودیت CORS یا قطع بودن سرویس.\nآدرس درخواست: &#x27;+SUPABASE_URL+&#x27;/rest/v1/site_notifications&#x27;;
  const status=err.status?&#x27;\nکد HTTP: &#x27;+err.status:&#x27;&#x27;;
  const code=err.code?&#x27;\nکد خطای Supabase: &#x27;+err.code:&#x27;&#x27;;
  const detail=err.details?&#x27;\nجزئیات: &#x27;+err.details:&#x27;&#x27;;
  const hint=err.hint?&#x27;\nراهنمای Supabase: &#x27;+err.hint:&#x27;&#x27;;
  return (err.message||String(err))+status+code+detail+hint;
}
async function request(path, options={}){
 const response=await fetch(SUPABASE_URL+&#x27;/rest/v1/&#x27;+path,{...options,headers:{apikey:SUPABASE_KEY,Authorization:&#x27;Bearer &#x27;+SUPABASE_KEY,&#x27;Content-Type&#x27;:&#x27;application/json&#x27;,Accept:&#x27;application/json&#x27;,Prefer:&#x27;return=representation&#x27;,...(options.headers||{})},cache:&#x27;no-store&#x27;});
 const raw=await response.text(); let data=null; try{data=raw?JSON.parse(raw):null}catch{data=raw}
 if(!response.ok){const e=new Error(data?.message||data?.error_description||data?.error||(&#x27;خطای HTTP &#x27;+response.status));e.status=response.status;e.code=data?.code;e.details=data?.details;e.hint=data?.hint;throw e;}
 return data;
}
function esc(s){return String(s??&#x27;&#x27;).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));}
async function loadRecent(){
 $(&#x27;recent&#x27;).innerHTML=&#x27;&lt;div class=&quot;empty&quot;&gt;در حال دریافت…&lt;/div&gt;&#x27;;
 try{
  const rows=await request(&#x27;site_notifications?select=id,title,message,created_at&amp;order=created_at.desc&amp;limit=8&#x27;,{method:&#x27;GET&#x27;});
  $(&#x27;recent&#x27;).innerHTML=rows.length?rows.map(n=&gt;`&lt;article class=&quot;item&quot;&gt;&lt;strong&gt;${esc(n.title||&#x27;اعلان بدون عنوان&#x27;)}&lt;/strong&gt;&lt;p&gt;${esc(n.message||&#x27;&#x27;)}&lt;/p&gt;&lt;small&gt;شناسه: ${esc(n.id)} · ${esc(n.created_at?new Date(n.created_at).toLocaleString(&#x27;fa-IR&#x27;):&#x27;&#x27;)}&lt;/small&gt;&lt;/article&gt;`).join(&#x27;&#x27;):&#x27;&lt;div class=&quot;empty&quot;&gt;هنوز اعلانی ثبت نشده است.&lt;/div&gt;&#x27;;
  connection.textContent=&#x27;اتصال برقرار است&#x27;;
 }catch(e){
  $(&#x27;recent&#x27;).innerHTML=&#x27;&lt;div class=&quot;empty&quot;&gt;دریافت اعلان‌ها ناموفق بود.\n&#x27;+esc(explainError(e))+&#x27;&lt;/div&gt;&#x27;;
  connection.textContent=&#x27;خطا در اتصال&#x27;;
 }
}
$(&#x27;sendForm&#x27;).addEventListener(&#x27;submit&#x27;,async e=&gt;{
 e.preventDefault();
 const title=$(&#x27;title&#x27;).value.trim(), message=$(&#x27;message&#x27;).value.trim();
 if(!title||!message){show(&#x27;err&#x27;,&#x27;عنوان و متن اعلان را کامل وارد کن.&#x27;);return;}
 sendBtn.disabled=true;sendBtn.textContent=&#x27;در حال ارسال…&#x27;;
 show(&#x27;info&#x27;,&#x27;در حال ارسال درخواست به Supabase…&#x27;);
 try{
  const rows=await request(&#x27;site_notifications&#x27;,{method:&#x27;POST&#x27;,body:JSON.stringify({title,message,active:true})});
  if(!Array.isArray(rows)||!rows.length) throw new Error(&#x27;درخواست ارسال شد اما Supabase رکورد ثبت‌شده را برنگرداند. تنظیم Prefer یا مجوز INSERT را بررسی کن.&#x27;);
  show(&#x27;ok&#x27;,&#x27;اعلان با موفقیت ثبت شد.\nشناسه اعلان: &#x27;+rows[0].id+&#x27;\nاکنون در صفحه اصلی، حداکثر پس از چرخه به‌روزرسانی اعلان‌ها نمایش داده می‌شود.&#x27;);
  $(&#x27;message&#x27;).value=&#x27;&#x27;;
  await loadRecent();
 }catch(err){show(&#x27;err&#x27;,&#x27;ارسال اعلان انجام نشد:\n&#x27;+explainError(err));}
 finally{sendBtn.disabled=false;sendBtn.textContent=&#x27;ارسال اعلان ✦&#x27;;}
});
$(&#x27;clearBtn&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{$(&#x27;title&#x27;).value=&#x27;&#x27;;$(&#x27;message&#x27;).value=&#x27;&#x27;;feedback.className=&#x27;notice&#x27;;feedback.textContent=&#x27;&#x27;;});
$(&#x27;refreshBtn&#x27;).addEventListener(&#x27;click&#x27;,loadRecent);
(async()=&gt;{try{await request(&#x27;site_notifications?select=id&amp;limit=1&#x27;,{method:&#x27;GET&#x27;});connection.textContent=&#x27;اتصال برقرار است&#x27;;}catch(e){connection.textContent=&#x27;خطا در اتصال&#x27;;show(&#x27;err&#x27;,&#x27;بررسی اتصال ناموفق بود:\n&#x27;+explainError(e));}await loadRecent();})();
&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;"></iframe>

</div>

<script>
'use strict';
const buttons = document.querySelectorAll('.nav-btn');
const modules = document.querySelectorAll('.module');

buttons.forEach(btn => {
  btn.addEventListener('click', () => {
    const target = btn.dataset.module;
    buttons.forEach(b => b.classList.toggle('active', b === btn));
    modules.forEach(m => m.classList.toggle('active', m.id === 'module-' + target));
    window.scrollTo({top:0, behavior:'smooth'});
  });
});
</script>
